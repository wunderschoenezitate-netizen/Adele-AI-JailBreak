# Server block for adeleai.org on the existing nginx. Install with:
#   cp /opt/adele-bot/deploy/nginx/adeleai.org.conf /etc/nginx/sites-available/adeleai.org
#   ln -s /etc/nginx/sites-available/adeleai.org /etc/nginx/sites-enabled/adeleai.org
#   nginx -t && systemctl reload nginx
# Then get the certificate (certbot edits this file to add HTTPS):
#   certbot --nginx -d adeleai.org -d www.adeleai.org
# Matches only these host names, so the other shop's server blocks are unaffected.
# web.py must listen on the same port (WEB_PORT in the env file, default 8088).
server {
    listen 80;
    listen [::]:80;
    server_name adeleai.org www.adeleai.org;

    access_log off;            # anonymous operation: no client IPs on disk
    client_max_body_size 256k;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
}
